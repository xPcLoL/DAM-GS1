<html>
    <head>
         <title>Transicion. Ejercicio 2</title>
         <script type="text/javascript" src="jquery-3.7.1.min.js"></script>
     <script language="JavaScript">
        $(document).ready(function(event){
            $("#ocultar").click(function(event){
                $(".imagen").hide(4000);
            });
            $("#mostrar").click(function(event){
                $(".imagen").show(4000);
            });
        });
    </script>
    
    <style type="text/css">
       
        
    </style>
    </head>                 
    <body>
       <img class="imagen" src="imagenes/fondo0.jpg" height="300">
       <img class="imagen" src="imagenes/fondo1.jfif" height="300">
       <br><br><br><br>
       <input type="button" id="ocultar" value="Click para ocultar elementos">
       <br><br><br><br>
       <input type="button" id="mostrar" value="Click para mostrar elementos">
    </body>
</html>
