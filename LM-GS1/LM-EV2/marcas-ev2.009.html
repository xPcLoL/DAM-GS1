<html>
    <head>
         <title>Tratar con el evento keyDown</title>
         <script type="text/javascript" src="jquery-3.7.1.min.js"></script>
     <script language="JavaScript">
      $(document).ready(function(){
            $("#escribe").keydown(function(event){
                $("#escribe").val(""); //equivale a la propiedad value
                $("#parrafo").text("El codigo de la tecla " + String.fromCharCode(event.which) + " es " + event.which);
            });
            $("#escribe").keyup(function(event){
                $("#parrafo").text("Acabas de soltar la tecla");
            });
    });
      
            
    </script>
    
    <style type="text/css">
        
    </style>
    </head>                 
    <body>
       <p>
            <input type="text" id="escribe">
       </p>
       <p id="parrafo">
            Manten pulsada una tecla y despues sueltala
       </p>
      
   
    </body>
</html>
