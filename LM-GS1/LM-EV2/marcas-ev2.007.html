<html>
    <head>
         <title>Animacion</title>
    <script type="text/javascript" src="jquery-3.7.1.min.js"></script>
    <script language="JavaScript">
      $(document).ready(function(){
       $("#flip").click(function(event){
            $("#panel").slideDown(10000);
       });
       $("button").click(function(){
            $("#panel").stop();
       });
    });
      
            
    </script>
    <style type="text/css">
       #panel, #flip{
        padding:5px;
        font-size: 18px;
        text-align: center;
        color: white;
        background-color: #555;
        border: solid 1px #666;
        border-radius: 3px;
       }
       #panel{
        padding: 50px;
        display: none;
       }
    </style>
    </head>                 
    <body>
        <button>Parar animacion!!!</button>
        <div id="flip">Click aqui para aumentar el panel</div>
        <div id="panel">Feliz año</div>
    </body>
</html>
