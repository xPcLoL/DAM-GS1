<html>
    <head>
         <title>Transicion. Ejercicio 2</title>
         <script type="text/javascript" src="jquery-3.7.1.min.js"></script>
     <script language="JavaScript">
        $(document).ready(function(event){
            $("#caja").css(
                {
                    width:"400px",
                    height:"30px",
                    backgroundColor:"yellow",
                    borderStyle:"solid",
                    borderWidth:"3px",
                    fontFamily:"Verdana",
                    padding:"20px",
                    fontSize:"12px",
                    textAlign:"center",
                    color:"blue"
                }
            );
            $("#boton").click(function(){
                $("#caja").slideUp(3000, function(){
                    $("#caja").slideDown(3000);
                });
            });
        });
    </script>
    
    <style type="text/css">
       
        
    </style>
    </head>                 
    <body>
        <input type="button" id="boton" value="Empezar">
        <div id="caja">Bienvenidos al aula de 1H</div>
    </body>
</html>
