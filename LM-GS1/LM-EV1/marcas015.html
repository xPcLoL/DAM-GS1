<html>
    <head>
        <title>Eventos de ratón</title>
    <script language="JavaScript">
        function cambiar(){
            imagen.src ="imagenes/monicius.png"
        }
        function cambiar2(){
            imagen.src="imagenes/playero.jfif"
        }
    </script>
    </head>
    <body>
        <h1 align="center">Eventos onmouseout y onmouseover</h1>
        <img id="imagen" src="imagenes/playero.jfif" width="1000" height="600" onmouseover="cambiar()" onmouseout="cambiar2()">
    </body>
</html>
