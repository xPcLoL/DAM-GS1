<html>
    <head>
        <title>Calculadora</title>
        <script language="JavaScript">
            function operar(){
                switch(operacion.value){
                    case "+":
                        resultado.innerHTML = parseInt(operando1.value)+parseInt(operando2.value);
                        break
                    case "-":
                        resultado.innerHTML = parseInt(operando1.value)-parseInt(operando2.value);
                        break
                    case "*":
                        resultado.innerHTML = parseInt(operando1.value)*parseInt(operando2.value);
                        break
                    case "/":
                        resultado.innerHTML = parseFloat(operando1.value)/parseFloat(operando2.value);            
                }
                //resultado.innerHTML="HOLA"  
            }
        </script>
        </head>
        <body>
            <table align="center" border="1">
                <tr>
                    <td><input id="operando1"></td>
                    <td><select id="operacion">
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="*">*</option>
                        <option value="/">/</option>
                    </select></td>
                    <td><input id="operando2"></td>
                    <td><input type="button" value="=" onclick="operar()"></td>
                    <td id="resultado" width="100"></td>
                </tr>
            </table>
        </body>
    
</html>
