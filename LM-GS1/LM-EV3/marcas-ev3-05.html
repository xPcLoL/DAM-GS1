<html>
    <head><Title>TIENDA ONLINE</Title>
        <link rel="stylesheet" href="estilos3.css" type="text/css">
        <script language="JavaScript">
            window.onload = mostrar;

            function mostrar(){
                cesta.innerHTML="";
                if(sessionStorage.length == 0){
                    cesta.innerHTML="<h5>No tienes productos en el carrito</h5>"
                }else{
                    cesta.innerHTML = "<table width=90%><tr><th>Producto</th><th>Unidades</th><th>Eliminar></th></tr></table>";
                    for(i = 0; i < sessionStorage.length; i++)
                        cesta.innerHTML += "<table width=90%><tr><td>" + sessionStorage.key(i) + "</td><td>" + sessionStorage.getItem(sessionStorage.key(i)) + "</td><td><input type=button value=Quitar onclick=eliminar('"+sessionStorage.key(i)+ "')></td></tr></table>";
                }
            }

            function almacenar(codigo){
                if(sessionStorage.getItem(codigo) == null){
                    sessionStorage.setItem(codigo,1);

                }else {
                    sessionStorage.setItem(codigo, parseInt(sessionStorage.getItem(codigo))+1)
                }
                mostrar();
            }
            function eliminar(codigo){
                if(sessionStorage.getItem(codigo) == 1){
                    sessionStorage.removeItem(codigo);
                    
                }else{
                    sessionStorage.setItem(codigo, parseInt(sessionStorage.getItem(codigo))-1)
                }
                mostrar();
            }
        </script>
    </head>
    <body>
        <div id="principal">
            
            <h1>Tienda Online</h1>
            <div id="productos">
            <table>
                <tr><th>IMAGEN</th><th>Descripcion</th><th>Comprar</th></tr>
                <tr>
                    <td><img src="imagenes/anuncio.webp"></td>
                    <td><span id="d1">Anuncio</span></td>
                    <td><input type="button" value="comprar" onclick="almacenar('anuncio')"></td>
                </tr>
                <tr>
                    <td><img src="imagenes/cajon.webp"></td>
                    <td><span id="d1">Cajon</span></td>
                    <td><input type="button" value="comprar" onclick="almacenar('cajon')"></td>
                </tr>
                <tr>
                    <td><img src="imagenes/comida.avif"></td>
                    <td><span id="d1">Comida perro</span></td>
                    <td><input type="button" value="comprar" onclick="almacenar('comida')"></td>
                </tr>
                <tr>
                    <td><img src="imagenes/higienizante.avif"></td>
                    <td><span id="d1">Higienizante</span></td>
                    <td><input type="button" value="comprar" onclick="almacenar('higienizante')"></td>
                </tr>
            </table>
            </div>
            <div id="carrito">
                <h4>Este es el carrito de la compra</h4>
                <div id="cesta"></div>
                <div id="total"></div>
            
            </div>
            <div id="pie"></div>
        </div>
    </body>
</html>
