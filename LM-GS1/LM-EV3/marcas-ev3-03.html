<html>
    <head>
        <title>Editor con HTML5</title>
        <link rel="stylesheet" href="estilos2.css">
        <script type="text/javascript" src="editor.js"></script>
    </head>
    <body>
        <div id="principal">
            <h2>Mensaje Publicitario</h2>
            <div id="mensajes"></div>
            <div id="editor">
                <h3>Publica aqui tu mensaje</h3>
                <div id="botones">
                    <img src="iconos/iconos/negrita.jpg" class="boton" onclick="negrita()">
                    <img src="iconos/iconos/cursiva.jpg" class="boton" onclick="cursiva()">
                    <img src="iconos/iconos/subrayado.jpg" class="boton" onclick="subrayado()">
                    <img src="iconos/iconos/alini.jpg" class="boton" onclick="alineai()">
                    <img src="iconos/iconos/alinc.jpg" class="boton" onclick="alineac()">
                    <img src="iconos/iconos/alind.jpg" class="boton" onclick="alinead()">
                    <img src="iconos/iconos/alinf.jpg" class="boton" onclick="alineaj()">
                    <img src="iconos/iconos/lno.jpg" class="boton" onclick="listano()">
                    <img src="iconos/iconos/lor.jpg" class="boton" onclick="listao()">
                    <img src="iconos/iconos/subi.jpg" class="boton" onclick="subi()">
                    <img src="iconos/iconos/supi.jpg" class="boton" onclick="supi()">
                    <img src="iconos/iconos/fco.jpg" class="boton" onclick="fontColor()">
                    <img src="iconos/iconos/bco.jpg" class="boton" onclick="backgroundColor()">
                    <img src="iconos/iconos/imagen.jpg" class="boton">
                    <img src="iconos/iconos/hipervinculo.jpg" class="boton">
                </div>
                <div id="contenido" contenteditable="true"></div>
            </div>
        </div>

    </body>
</html>
