<html>
<head>
    <title>Ejercicio 1</title>
    <script>
        document.addEventListener('DOMContentLoaded', function(){
            var lista = document.getElementById('productosList');

            var request = window.indexedDB.open('tienda', 1);

            request.onerror = function(event){
                console.log("Error al abrir la base de datos");
            }

            request.onsuccess = function(event){
                var db = event.target.result;
                
                var form = document.getElementById('productoForm');
                form.addEventListener('submit',function(e){
                    var idC = form.elements['id'].value;
                    var nombreC = form.elements['nomProducto'].value;
                    var transaction = db.transaction(['productos'], 'readwrite');
                    var store = transaction.objectStore('productos');
                    var producto = {id: idC, nomProducto: nombreC};
                    var addRequest = store.add(producto);
                    addRequest.onsuccess = function(event){
                        console.log('Producto agregado correctamente');
                        form.reset();
                    }
                    addRequest.onerror = function(event){
                        console.log('Error al agregar el producto');
                    }
                });
            };

            request.onupgradeneeded = function(event){
                var db = event.target.result;
                var store = db.createObjectStore('productos', {keyPath:'id'});
            }

            
        });
    </script>
</head>
<body>
    <h1>Insertar producto</h1>
    <form id="productoForm">
        <label for="id">ID:</label>
        <input id="id" name="id" required><br>
        <label for="nomProducto">Nombre del producto:</label>
        <input id="nomProducto" name="nomProducto" required><br>
        <button type="submit">Agregar producto</button>
    </form>
</body>
</html>
